<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10" />
      <stop offset="50%" stop-color="#0f141f" />
      <stop offset="100%" stop-color="#06080c" />
    </linearGradient>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="plasmaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#1e293b" stroke-width="3" opacity="0.7" />

  <!-- Background Ambient Plasma Core Glow -->
  <circle cx="256" cy="248" r="160" fill="url(#plasmaCore)" />

  <!-- Distinctive Forge Anvil / Monolithic "DF" Hexagonal Geometry -->
  <!-- Outer Technical Anvil Ring -->
  <path d="M 120 180 L 256 100 L 392 180 L 392 332 L 256 412 L 120 332 Z" 
        fill="none" stroke="url(#ironGrad)" stroke-width="12" stroke-linejoin="round" opacity="0.6"/>

  <!-- Stylized Geometric "DF" Anvil Monolith -->
  <!-- 'D' Wing (Left) -->
  <path d="M 170 160 L 236 160 C 274 160 290 186 276 220 L 244 290 C 234 314 208 330 182 330 L 170 330 Z" 
        fill="url(#ironGrad)" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
  <!-- D Inner Cavity -->
  <path d="M 194 190 L 226 190 C 242 190 250 202 242 220 L 222 265 C 216 278 204 286 194 286 Z" 
        fill="#0a0e17" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>

  <!-- 'F' Wing & Thermal Forge Hammer / Flux Core (Right) -->
  <path d="M 276 160 L 342 160 L 332 194 L 290 194 L 282 226 L 322 226 L 312 260 L 274 260 L 256 330 L 226 330 Z" 
        fill="url(#forgeGrad)" filter="url(#forgeGlow)" />

  <!-- Thermal Plasma Sparks / Precision Matrix -->
  <circle cx="356" cy="148" r="5" fill="#fef08a" filter="url(#forgeGlow)" />
  <circle cx="376" cy="180" r="3" fill="#38bdf8" />
  <circle cx="140" cy="200" r="4" fill="#6366f1" />
  <circle cx="256" cy="380" r="4" fill="#f97316" />

  <!-- Central Forge Focal Aperture -->
  <polygon points="256,220 274,250 256,280 238,250" fill="#ffffff" opacity="0.9" filter="url(#forgeGlow)"/>
</svg>
